[package]
name = "viking"
description = "Core implementation for viking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# global allocator
mimalloc = { version = "0.1.52", optional = true }

# -- core deps (always pulled in) --
colored = "2"
cpp_demangle = "0.4.0"
crossterm = "0.27.0"
csv = "1.1.0"
cu = { package = "pistonite-cu", version = "0.9.9", features = ["fs", "yaml", "toml", "json", "derive"] }
env_logger = "0.11.11"
inquire = "0.7.4"
itertools = "0.15.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["rc"] }
serde-tuple-vec-map = "1.0.1"
shell-words = "1.1.1"
textwrap = "0.16.4"
viking-macro.workspace = true
viking-proc-macro.workspace = true

# -- python deps --
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py3xx" specifies the stable ABI and minimum Python version support,
# instead of require a different wheel per python version
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py314", "experimental-inspect"], optional = true }

# -- elf deps --
addr2line = { version = "0.22.0", optional = true }
goblin = { version = "0.8.0", optional = true }
memmap = { version = "0.7.0", optional = true }
owning_ref = { version = "0.4.1", optional = true }

# -- command deps --
bad64 = { version = "0.9.0", optional = true }
capstone = { git = "https://github.com/leoetlino/capstone-rs", rev = "f5aa278e1982bca86a67ac8b8550ab1dd70f7d9d", optional = true }
clang = { version = "2.0.0", features = ["runtime", "clang_10_0"], optional = true }
json_compilation_db = { version = "0.3.0", optional = true }
lazy-init = { version = "0.5.0", optional = true }
reqwest = { version = "0.12.3", default-features = false, features = ["http2", "blocking", "json", "rustls-tls"], optional = true }
tempfile = { version = "3.20.0", optional = true }

[build-dependencies]
pyo3-build-config = "0.28.2"

[features]
default = []
# uncomment below for development for rust-analyzer, or set in your local rust-analyzer
# config the default feature set it should use
# default = [ "python" ]
python = [ "dep:pyo3", "global-allocator", "cmd-all" ]
cmd-all = [
    "cmd-check",
    "cmd-decompme",
    "cmd-listsym"
]
global-allocator = [ "dep:mimalloc" ]
cmd-check = [
    "cu/cli",
    "elf",
    "dep:capstone",
    "dep:lazy-init",
]
cmd-decompme = [
    "cu/cli",
    "elf",
    "dep:bad64",
    "dep:clang",
    "dep:json_compilation_db",
    "dep:tempfile",
    "dep:reqwest",
]
cmd-listsym = [
    "cu/cli",
    "elf",
]
elf = [
    "dep:addr2line",
    "dep:goblin",
    "dep:owning_ref",
    "dep:memmap",
]
nightly = [] # used for doc_cfg feature in doc generation

# Multi-call binary
[[bin]]
name = "viking"
path = "main.rs"
required-features = [ "global-allocator", "cmd-all" ]
