name: pr
on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          rust: stable
          python: uv
      - run: task install
      - run: task py-bindgen
      - run: task test
