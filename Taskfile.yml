version: '3'

vars:
  # Setting a different cargo target-dir for maturin builds,
  # because maturin injects different RUSTFLAGS for its cargo invocation.
  # Sharing the default target/ means maturin builds and raw cargo builds
  # (such as rust-analyzer/cargo-clippy) steps on each other and causes
  # unnecessary rebuilds. This speeds up local dev workflows at the cost
  # of double the disk usage
  MATURIN_DEV_TARGET: target/maturin-dev

tasks:
  # --- workflows ---
  install:
    desc: Install dependencies
    cmds:
      - task: install-deps
      - task: py-bindgen

  run:
    desc: Run the viking CLI (pass the args to viking after -- )
    cmds:
      - task: install-dev
      - uv run --no-sync viking {{.CLI_ARGS}}

  check:
    desc: Check code for issues
    cmds:
      - task: py-bindgen
      - uv run --no-sync basedpyright --warnings
      # TODO: implementation in progress so there are unused stuff
      - task: cargo-clippy
      - uv run --no-sync ruff format src --check
      - uv run --no-sync ruff check
      - cargo fmt --check

  fix:
    desc: Fix code formatting
    cmds:
      - uv run --no-sync ruff format src
      - uv run --no-sync ruff check --fix --fixable I001 # only format imports
      - cargo fmt

  build:
    desc: Build the wheel
    cmds:
      - uv build

  doc:
    desc: Generate API docs
    cmds:
      - rm -rf dist/docs
      - task: build-docs

  dev-doc:
    desc: Host doc in watch mode (please `cargo install shwoop`)
    cmds:
      - shwoop dist/docs --host -w src -- {{.TASK_EXE}} build-docs

  # --- helpers ---

  install-deps:
    sources:
      - Taskfile.yml
      - pyproject.toml
      - uv.lock
    cmds:
      # --no-install-project skips building and installing viking
      # which is slow because UV has to rebuild all the Rust side
      # from scratch
      - uv sync --no-install-project

  py-bindgen:
    internal: true # Just run the install task to regenerate the binding
    desc: (Re-)generate the _core.pyi interface module
    sources:
      - Taskfile.yml
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - src/**/Cargo.toml
    cmds:
      # build the extension module so we can extract the doc string out of it
      - task: install-dev
      - uv run --no-sync maturin generate-stubs --quiet --out src --target-dir {{.MATURIN_DEV_TARGET}}
      - uv run --no-sync scripts/add-docs-to-stubs.py

  install-dev:
    # This builds the dev profile and installs it into the uv environment.
    # Then we can run it with 'uv run --no-sync viking'
    # Running 'uv run viking' directly requires buiding from scratch each time
    sources:
      - Taskfile.yml
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - src/**/Cargo.toml
    generates:
      - .venv/bin/viking # this ensures we rebuild if install-deps removes the dependency
    cmds:
      - uv run --no-sync maturin develop --uv --target-dir {{.MATURIN_DEV_TARGET}}

  build-docs:
    env:
      VIKING_CONFIG: '0' # use empty config
    cmds:
      - task: py-bindgen
      - uv run --no-sync scripts/build-docs.py

  cargo-clippy:
    vars:
      CLIPPY_FLAGS: >
        -D warnings
        -D clippy::todo
        -A clippy::manual_range_contains
        -A clippy::collapsible_if
        -A clippy::collapsible_else_if
        -A clippy::collapsible_match
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo clippy {{.FLAGS}} -- {{.CLIPPY_FLAGS}}

  clean:
    desc: Clean caches and outputs. Commands will run slower!
    cmds:
      - cargo clean
      - rm -rf .venv dist .ruff_cache
      - rm -rf src/**/__pycache__ src/**/*.so
      - rm -rf src/viking/_core


