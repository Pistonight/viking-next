[workspace]
resolver = "2"
members = [
    "src/viking_core",
    "src/viking_macro",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
viking-macro.path = "src/viking_macro"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
