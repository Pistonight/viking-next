[project]
name = "viking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pistonight", email = "pistonknight@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asm-differ"
]

[project.scripts]
viking = "viking.cli:main"

[tool.maturin]
module-name = "viking._core"
python-packages = ["viking"]
python-source = "src"
manifest-path = "src/viking_core/Cargo.toml"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "src/viking_core/Cargo.toml" },
    { file = "Cargo.lock" },
]

[tool.uv.sources]
asm-differ = { git = "https://github.com/simonlindholm/asm-differ", rev = "0dd09af8f8008f1f880327cf0aca3b26d2562ea2" }



[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "maturin>=1.15.0",
    "ruff>=0.17.0",
]
